# 詹姆斯智能体 / James Agent —— 测试安装包（第 5a 步）
# 本轮仅构建马来西亚 iGaming 专用版 Apple 芯片 Mac 安装包。
# Mac Apple 芯片：macos-15 上 PyInstaller + dmgbuild → arm64 .dmg
name: build-my-igaming-mac-apple

on:
  # This branch exists for the requested test build; ordinary source edits do not trigger builds.
  push:
    branches: ['build/jamesagent-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-arm:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt
      - name: Build .dmg (Apple silicon)
        run: bash packaging/build_mac.sh "$(which python)"
      - name: Packaged API smoke and version checks
        env:
          SALESTEAM_NO_SCHEDULER: "1"
        run: .venv-build/bin/python packaging/smoke_package.py "dist/JamesAgent 马来西亚 iGaming 代理版.app/Contents/MacOS/JamesAgent"
      - uses: actions/upload-artifact@v7
        with:
          name: JamesAgent-MY-iGaming-0.3.1-Mac-Apple-dmg
          path: |
            dist/*.dmg
            dist/packaged-smoke.json
          if-no-files-found: error
          retention-days: 14
