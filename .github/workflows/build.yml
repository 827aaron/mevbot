# 詹姆斯智能体 / James Agent —— 测试安装包（第 5a 步）
# Windows：PyInstaller + Inno Setup → JamesAgent-Setup-<版本>.exe（作为构建产物上传，不发布）
# Mac Apple 芯片：macos-15 上 PyInstaller + dmgbuild → arm64 .dmg
name: build-test-installers

on:
  # This branch exists for the requested test build; ordinary source edits do not trigger builds.
  push:
    branches: [build/jamesagent-0.3.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/requirements-build.txt
          pip check

      - name: Smoke test (import + server startup, no window)
        env:
          SALESTEAM_DATA: ${{ runner.temp }}\ja-smoke
          SALESTEAM_NO_SCHEDULER: "1"
        run: python -c "from salesteam import server; server.startup(); import webview; print('ok')"

      - name: Source regression tests
        env:
          SALESTEAM_NO_SCHEDULER: "1"
          SALESTEAM_QA_FIXTURES: ""
        run: python -m unittest discover -s tests -v

      - name: Tray icon smoke test (pythonnet NotifyIcon, PRD 9.0.1)
        continue-on-error: true      # 运行器没有交互桌面时托盘可能建不起来：只看结果，不挡住打包
        env:
          SALESTEAM_DATA: ${{ runner.temp }}\ja-tray
        run: >-
          python -c "import time; from salesteam import tray;
          t = tray.Tray(lambda: None, lambda p: None, lambda: None);
          ok = t.start(); print('tray started:', ok);
          t.update({'working': 2, 'qualified_today': 3, 'urgent': 1, 'paused': False, 'show_seq': 0, 'lang': 'zh'});
          time.sleep(2); print('menu:', t._impl.mi_status.Text if ok else '-', '|', t._impl.mi_urgent.Text if ok else '-');
          t.stop(); time.sleep(1); assert ok"

      - name: Build app folder (PyInstaller)
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build packaging/JamesAgent.spec

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = (Select-String -Path salesteam/__init__.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$ver" packaging/windows/JamesAgent.iss

      - name: Packaged app smoke test (server only, no window)
        shell: pwsh
        env:
          SALESTEAM_DATA: ${{ runner.temp }}\ja-packaged
          SALESTEAM_HEADLESS: "1"
          SALESTEAM_NO_BROWSER_DOWNLOAD: "1"
          SALESTEAM_NO_SCHEDULER: "1"
          SALESTEAM_PORT: "8790"
        run: python packaging/smoke_package.py "dist\JamesAgent\JamesAgent.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: JamesAgent-Windows-installer
          path: |
            dist/JamesAgent-Setup-*.exe
            dist/packaged-smoke.json
          if-no-files-found: error
          retention-days: 14

  mac-arm:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt
      - name: Build .dmg (Apple silicon)
        run: bash packaging/build_mac.sh "$(which python)"
      - name: Packaged API smoke and version checks
        env:
          SALESTEAM_NO_SCHEDULER: "1"
        run: .venv-build/bin/python packaging/smoke_package.py "dist/詹姆斯智能体.app/Contents/MacOS/JamesAgent"
      - uses: actions/upload-artifact@v7
        with:
          name: JamesAgent-Mac-Apple-dmg
          path: |
            dist/*.dmg
            dist/packaged-smoke.json
          if-no-files-found: error
          retention-days: 14
